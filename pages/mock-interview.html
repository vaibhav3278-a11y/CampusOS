<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusOS | AI Mock Interviewer</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .interview-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 1.5rem;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        .question-box {
            padding: 1rem 1.2rem;
            background: #f0f4ff;
            border-left: 4px solid #4f46e5;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e1b4b;
            margin-bottom: 1.5rem;
        }
        .transcribe-box {
            width: 100%;
            min-height: 140px;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 1rem;
            background: #f9fafb;
            resize: vertical;
            box-sizing: border-box;
        }
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }
        .btn-mic { background: #10b981; color: #fff; }
        .btn-mic.recording { background: #ef4444; animation: pulse 1.5s infinite; }
        .btn-submit { background: #4f46e5; color: #fff; }
        .feedback-card {
            display: none;
            padding: 1.2rem;
            border-radius: 8px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="interview-container">
        <h2>🎙️ Real-Time AI Mock Interview</h2>
        <p>Practice spoken responses with live transcription and recruiter-level evaluation.</p>

        <div class="question-box" id="interviewQuestion">
            "Tell me about a challenging project where your initial strategy failed. How did you diagnose the breakdown and pivot?"
        </div>

        <textarea id="liveTranscript" class="transcribe-box" placeholder="Click 'Start Speaking' and answer out loud. Your voice will transcribe here in real time..."></textarea>

        <div class="controls">
            <button id="micBtn" class="btn btn-mic">🎤 Start Speaking</button>
            <button id="submitAnswerBtn" class="btn btn-submit">Evaluate My Answer</button>
            <button id="nextQuestionBtn" class="btn" style="background:#e5e7eb; color:#374151;">New Question</button>
        </div>

        <div id="feedbackContainer" class="feedback-card">
            <h3>Recruiter Feedback & Score</h3>
            <div id="feedbackContent" style="white-space: pre-wrap; line-height: 1.6;"></div>
        </div>
    </div>

    <script src="../assets/js/services/aiService.js?v=2.6"></script>
    <script src="../assets/js/modules/mockInterview.js?v=1.0"></script>
</body>
</html>
