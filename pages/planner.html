<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusOS | Planner</title>
    <link rel="manifest" href="../manifest.json">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon">🎓</div>
            <h2>CampusOS</h2>
        </div>
        <ul class="sidebar-menu">
            <li><a href="../dashboard.html">🏠 Dashboard</a></li>
            <li><a href="assignments.html">📚 Assignments</a></li>
            <li><a href="notes.html">📝 Notes</a></li>
            <li><a href="casestudy.html">💼 Case Solver</a></li>
            <li class="active"><a href="planner.html">📅 Planner</a></li>
            <li><a href="internship.html">💼 Internship</a></li>
            <li><a href="placement.html">🎯 Placement</a></li>
            <li><a href="profile.html">👤 Profile</a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <div class="topbar">
            <div style="display: flex; align-items: center; gap: 15px;">
                <button id="mobileMenuBtn" class="mobile-menu-btn" style="display: none; background: none; border: none; font-size: 24px; cursor: pointer;">☰</button>
                <h2>📅 Academic Planner</h2>
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="aiPlannerBtn" class="btn btn-outline" style="border-color: var(--primary); color: var(--primary);">
                    ✨ AI Study Schedule
                </button>
                <button id="addTaskBtn" class="btn btn-primary">
                    + Add Task
                </button>
            </div>
        </div>

        <!-- Planner Task Section -->
        <div class="assignment-list" id="plannerList">
            <!-- Planner tasks rendered via JS -->
        </div>

        <!-- Standard Task Modal -->
        <div id="taskModal" class="modal">
            <div class="modal-content">
                <h2 id="taskModalTitle">📅 Add Task</h2>
                <form id="taskForm">
                    <div class="input-group">
                        <label>Task Title</label>
                        <input type="text" id="taskTitle" required>
                    </div>
                    <div class="input-group">
                        <label>Date</label>
                        <input type="date" id="taskDate" required>
                    </div>
                    <div class="input-group">
                        <label>🔗 Course / Resource Link (Optional)</label>
                        <input type="url" id="taskLink" placeholder="https://coursera.org/... or documentation URL">
                    </div>
                    <div class="modal-buttons">
                        <button type="submit" class="btn btn-primary">Save Task</button>
                        <button type="button" id="cancelTaskBtn" class="btn btn-outline">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- ================= AI PLANNER MODAL ================= -->
        <div id="aiPlannerModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>✨ Generate AI Study Schedule</h3>
                    <button class="modal-close" onclick="Modal.close('aiPlannerModal')">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="input-group">
                        <label for="aiPlannerSubject">Subject, Certificate, or Exam Topic</label>
                        <input type="text" id="aiPlannerSubject" placeholder="E.g., AWS Cloud Practitioner, DSA, or Supply Chain Management" />
                    </div>
                    <div class="input-group">
                        <label for="aiPlannerDays">Duration (Days)</label>
                        <input type="number" id="aiPlannerDays" value="5" min="1" max="14" />
                    </div>
                    <div id="aiPlannerLoading" style="display: none; text-align: center; padding: 10px; color: var(--primary);">
                        ⏳ Building your study roadmap with verified resources...
                    </div>
                </div>
                <div class="modal-buttons">
                    <button id="submitAiPlanner" class="btn btn-primary">✨ Generate Plan</button>
                    <button class="btn btn-outline" type="button" onclick="Modal.close('aiPlannerModal')">Cancel</button>
                </div>
            </div>
        </div>

    </main>

</div>

<!-- Core Scripts -->
<script src="../assets/js/core/storage.js"></script>
<script src="../assets/js/core/toast.js"></script>
<script src="../assets/js/core/modal.js"></script>
<script src="../assets/js/core/validator.js"></script>
<script src="../assets/js/core/dateUtils.js"></script>

<!-- Services -->
<script src="../assets/js/services/aiService.js"></script>
<script src="../assets/js/services/plannerService.js"></script>

<!-- Page Logic -->
<script src="../assets/js/page/planner.js"></script>

<script src="../assets/js/services/settingsService.js"></script>
<script src="../assets/js/core/theme.js"></script>

</body>

</html>
