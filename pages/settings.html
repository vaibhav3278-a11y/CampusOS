<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusOS | Settings</title>
    <link rel="manifest" href="../manifest.json">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
</head>

<body>

<div class="dashboard-layout">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">🎓</div>

            <h2>CampusOS</h2>

        </div>

        <ul class="sidebar-menu">

            <li>
                <a href="../dashboard.html">🏠 Dashboard</a>
            </li>

            <li>
                <a href="assignments.html">📚 Assignments</a>
            </li>

            <li>
                <a href="notes.html">📝 Notes</a>
            </li>

            <li>
                <a href="planner.html">📅 Planner</a>
            </li>

            <li>
                <a href="assistant.html">🤖 AI Assistant</a>
            </li>

            <li>
                <a href="internship.html">💼 Internship</a>
            </li>

            <li>
                <a href="placement.html">🎯 Placement</a>
            </li>

            <li>
                <a href="profile.html">👤 Profile</a>
            </li>

            <li class="active">
                <a href="settings.html">⚙ Settings</a>
            </li>

        </ul>

    </aside>

    <!-- Main -->

    <main class="main-content">

       <div class="topbar">
    <div style="display: flex; align-items: center; gap: 15px;">
        <!-- Mobile Toggle Button -->
        <button id="mobileMenuBtn" class="mobile-menu-btn" style="display: none; background: none; border: none; font-size: 24px; cursor: pointer;">
            ☰
        </button>
        <h2>⚙️ Platform Settings</h2>
    </div>
</div>

        <!-- Preferences -->

        <div class="card">

            <div class="card-header">

                <h2 class="card-title">

                    Preferences

                </h2>

            </div>

            <div class="card-body">

                <div class="form-group">

                    <label class="form-label">

                        <input
                            type="checkbox"
                            id="darkMode">

                        Enable Dark Mode

                    </label>

                </div>

                <div class="form-group">

                    <label class="form-label">

                        <input
                            type="checkbox"
                            id="notifications">

                        Enable Notifications

                    </label>

                </div>

                <div class="form-group">

                    <label class="form-label">

                        <input
                            type="checkbox"
                            id="autoSave">

                        Enable Auto Save

                    </label>

                </div>

            </div>

        </div>

        <br>

        <!-- Data Management -->

        <div class="card">

            <div class="card-header">

                <h2 class="card-title">

                    Data Management

                </h2>

            </div>

            <div class="card-body">

                <div class="card-footer">

                    <button
                        id="exportBtn"
                        class="btn btn-primary">

                        📤 Export Data

                    </button>

                    <button
                        id="importBtn"
                        class="btn btn-outline">

                        📥 Import Data

                    </button>

                    <button
                        id="resetSettingsBtn"
                        class="btn btn-outline">

                        🔄 Reset Settings

                    </button>

                    <button
                        id="clearDataBtn"
                        class="btn btn-danger">

                        🗑 Clear All Data

                    </button>

                </div>

                <input
                    type="file"
                    id="importFile"
                    accept=".json"
                    hidden>

            </div>

        </div>

    </main>

</div>

<script src="../assets/js/core/storage.js"></script>
<script src="../assets/js/core/toast.js"></script>

<script src="../assets/js/services/settingsService.js"></script>

<script src="../assets/js/page/settings.js"></script>

<script src="../assets/js/services/settingsService.js"></script>
<script src="../assets/js/core/theme.js"></script>
<script src="../assets/js/core/notification.js"></script>

</body>

</html>
