<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusOS | Register</title>

    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

<section class="auth">

    <div class="auth-container">

        <!-- LEFT -->

        <div class="auth-left">

            <div class="logo">

                <div class="logo-icon">🎓</div>

                <h2>CampusOS</h2>

            </div>

            <h1>Create Your Account 🚀</h1>

            <p>

                Join CampusOS and organize your academics,
                internships, placements and AI learning in one place.

            </p>

            <div class="auth-image">
                🎓
            </div>

        </div>

        <!-- RIGHT -->

        <div class="auth-right">

            <div class="auth-card">

                <h2>Register</h2>

                <p>Create your account</p>

                <form id="registerForm">

                    <div class="input-group">

                        <label>Full Name</label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your name"
                            required>

                    </div>

                    <div class="input-group">

                        <label>Email</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required>

                    </div>

                    <div class="input-group">

                        <label>Password</label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create password"
                            required>

                    </div>

                    <div class="input-group">

                        <label>Confirm Password</label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm password"
                            required>

                    </div>

                    <button
                        type="submit"
                        class="start-btn">

                        Create Account

                    </button>

                </form>

                <p class="bottom-text">

                    Already have an account?

                    <a href="login.html">

                        Login

                    </a>

                </p>

            </div>

        </div>

    </div>

</section>

<script src="assets/js/page/register.js"></script>

</body>

</html>
